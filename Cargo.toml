[package]
name = "openmhz"
version = "0.1.2"
edition = "2021"
description = "Uploads recorded calls to OpenMHz."
license = "GPL-3.0-or-later"
repository = "https://github.com/TrunkRecorder/trunk-plugin-openmhz"
authors = ["Luke Berndt <lukekb@gmail.com>"]
publish = false

[dependencies]
trunk-recorder-plugin = "0.1.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust TLS (rustls), so the release builds cross-compile.
ureq = "3"

[profile.release]
strip = true
lto = true
